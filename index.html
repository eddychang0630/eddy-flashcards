<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="英文字卡">
  <meta name="theme-color" content="#6366f1">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>英文字卡 App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6366f1;
      --bg: #0f0f13;
      --card-bg: #1a1a24;
      --text: #f1f1f5;
      --muted: #8b8b9e;
      --border: #2a2a3a;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --radius: 20px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }
    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }
    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* Top Bar */
    #top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(var(--safe-top) + 14px) 18px 12px;
      background: var(--bg); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #top-bar h1 { font-size: 1rem; font-weight: 700; white-space: nowrap; }
    .mode-toggle { display: flex; gap: 4px; background: var(--card-bg); border-radius: 12px; padding: 3px; }
    .mode-btn {
      padding: 6px 14px; border-radius: 9px; font-size: 0.75rem; font-weight: 700;
      border: none; cursor: pointer; transition: all 0.2s;
      background: transparent; color: var(--muted); white-space: nowrap;
    }
    .mode-btn.active { background: var(--primary); color: #fff; }

    /* Progress */
    #progress-wrap { padding: 10px 18px 8px; flex-shrink: 0; }
    .progress-row { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); margin-bottom: 5px; }
    .progress-bar-bg { height: 3px; background: var(--border); border-radius: 999px; }
    .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.4s ease; }

    /* Screens */
    .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
    .screen.active { display: flex; }

    /* ══ QUIZ MODE ══ */
    #quiz-scores { display: flex; gap: 8px; padding: 0 18px 10px; flex-shrink: 0; }
    .score-box {
      flex: 1; background: var(--card-bg); border-radius: 14px;
      padding: 10px 6px; text-align: center; border: 1px solid var(--border);
    }
    .score-box .s-label { font-size: 0.6rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .score-box .s-num { font-size: 1.6rem; font-weight: 800; margin-top: 2px; }
    .score-box.green .s-num { color: var(--green); }
    .score-box.red .s-num { color: var(--red); }

    /* Flip Card */
    #quiz-card-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 0 18px; perspective: 1200px; min-height: 0;
    }
    .flip-wrapper { width: 100%; max-width: 420px; height: 210px; position: relative; }
    .flip-inner {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(.4,0,.2,1);
    }
    .flip-inner.flipped { transform: rotateY(180deg); }
    .flip-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: var(--radius); padding: 20px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .flip-front { background: var(--card-bg); border: 1px solid var(--border); cursor: pointer; }
    .flip-back { background: linear-gradient(135deg,#1e1b4b,#1a1a30); border: 1.5px solid rgba(99,102,241,0.5); transform: rotateY(180deg); }

    /* Front card: word layout */
    .flip-badge {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.07em;
      padding: 3px 10px; border-radius: 999px;
      background: rgba(99,102,241,0.15); color: #818cf8;
      margin-bottom: 8px; align-self: flex-start; text-transform: uppercase;
    }
    /* ★ KEY FIX: single line, auto-shrink font */
    .flip-word {
      font-weight: 800; line-height: 1.1; color: var(--text);
      white-space: nowrap; overflow: hidden;
      /* JS will set font-size dynamically */
    }
    .flip-phonetic { font-size: 0.78rem; color: #818cf8; margin-top: 4px; font-family: monospace; }
    .flip-hint { font-size: 0.67rem; color: var(--muted); margin-top: 10px; }

    /* Back card */
    .flip-back-content { display: flex; flex-direction: column; gap: 6px; }
    .flip-pos-tag { font-size: 0.65rem; font-weight: 700; color: #818cf8; text-transform: uppercase; letter-spacing: 0.06em; }
    .flip-meaning { font-size: 0.95rem; font-weight: 600; line-height: 1.4; color: var(--text); }
    .flip-ex { font-size: 0.73rem; color: var(--muted); font-style: italic; line-height: 1.4; margin-top: 4px; }

    #swipe-hint { text-align: center; font-size: 0.67rem; color: var(--muted); padding: 5px 0; flex-shrink: 0; }

    #quiz-actions {
      padding: 10px 18px; flex-shrink: 0; display: flex; flex-direction: column; gap: 9px;
      padding-bottom: max(10px, var(--safe-bottom));
    }
    #btn-flip {
      width: 100%; padding: 15px; background: var(--primary); color: #fff;
      border: none; border-radius: 16px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
    }
    #btn-flip:active { opacity: 0.85; }
    .judge-row { display: none; gap: 9px; }
    .judge-row.show { display: flex; }
    .judge-btn {
      flex: 1; padding: 14px; border: 1.5px solid; border-radius: 16px;
      font-size: 0.88rem; font-weight: 700; cursor: pointer; background: transparent;
    }
    .judge-btn.know { border-color: var(--green); color: var(--green); }
    .judge-btn.know:active { background: rgba(34,197,94,0.12); }
    .judge-btn.dunno { border-color: var(--red); color: var(--red); }
    .judge-btn.dunno:active { background: rgba(239,68,68,0.12); }

    /* ══ STUDY MODE ══ */
    #study-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 18px; }

    .study-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }

    /* ★ KEY FIX: word header layout — each element on its own line */
    .s-header { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }

    /* Word: single line, font auto-shrinks via JS */
    .s-word {
      font-weight: 800; line-height: 1.15; color: var(--text);
      white-space: nowrap; overflow: hidden;
      display: block; width: 100%;
    }
    /* Phonetic: own line */
    .s-phonetic {
      display: block; font-size: 0.82rem; color: #818cf8;
      font-family: 'Courier New', monospace; margin-top: 5px; line-height: 1;
    }
    /* POS + Chinese meaning: own line */
    .s-pos-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .s-pos {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em;
      padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
    }
    .s-meaning-inline { font-size: 0.88rem; font-weight: 600; color: var(--text); line-height: 1.4; }

    /* Sections */
    .s-block { padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .s-block:last-child { border-bottom: none; }
    .s-section-label { font-size: 0.6rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
    .s-en { font-size: 0.83rem; font-style: italic; color: var(--text); line-height: 1.55; background: rgba(99,102,241,0.08); border-left: 3px solid var(--primary); padding: 9px 13px; border-radius: 0 10px 10px 0; margin-bottom: 7px; }
    .s-zh { font-size: 0.79rem; color: var(--muted); padding-left: 4px; line-height: 1.5; }

    /* Synonyms / Antonyms */
    .syn-ant-grid { display: flex; gap: 8px; }
    .syn-box, .ant-box {
      flex: 1; border-radius: 12px; padding: 9px 11px;
    }
    .syn-box { background: rgba(34,197,94,0.07); border: 1px solid rgba(34,197,94,0.25); }
    .ant-box { background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.25); }
    .syn-ant-title { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 5px; }
    .syn-box .syn-ant-title { color: var(--green); }
    .ant-box .syn-ant-title { color: var(--red); }
    .syn-ant-en { font-size: 0.75rem; color: var(--text); font-weight: 600; line-height: 1.4; }
    .syn-ant-zh { font-size: 0.7rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .no-data { font-size: 0.72rem; color: var(--muted); font-style: italic; }

    /* Navigation */
    #study-nav {
      display: flex; gap: 9px; padding: 10px 18px; flex-shrink: 0;
      padding-bottom: max(10px, var(--safe-bottom)); border-top: 1px solid var(--border);
    }
    .nav-btn {
      padding: 14px 16px; border-radius: 14px; font-weight: 700; border: 1.5px solid var(--border);
      background: var(--card-bg); color: var(--text); font-size: 0.88rem; cursor: pointer; white-space: nowrap;
    }
    .nav-btn.primary { flex: 1; background: var(--primary); border-color: var(--primary); color: #fff; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .nav-btn:not(:disabled):active { opacity: 0.8; transform: scale(0.97); }

    /* Tab Bar */
    #tab-bar {
      display: flex; background: var(--card-bg); border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom); flex-shrink: 0;
    }
    .tab-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 9px 0 6px; gap: 3px; background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.6rem; font-weight: 700; transition: color 0.2s;
    }
    .tab-icon { font-size: 1.4rem; }
    .tab-btn.active { color: var(--primary); }

    /* Finish Overlay */
    #finish-overlay {
      display: none; position: fixed; inset: 0; background: rgba(15,15,19,0.97);
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; padding: 32px; text-align: center;
    }
    #finish-overlay.show { display: flex; }
    .fin-emoji { font-size: 4rem; margin-bottom: 14px; }
    .fin-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
    .fin-msg { color: var(--muted); font-size: 0.88rem; margin-bottom: 28px; line-height: 1.7; white-space: pre-line; }
    .fin-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
    .fin-btn { padding: 15px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; }
    .fin-btn.primary { background: var(--primary); color: #fff; }
    .fin-btn.secondary { background: var(--card-bg); color: var(--text); border: 1.5px solid var(--border); }

    /* Animations */
    @keyframes cardIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes popAnim { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
    @keyframes shakeAnim { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    .anim-in { animation: cardIn 0.26s ease; }
    .anim-pop { animation: popAnim 0.26s ease; }
    .anim-shake { animation: shakeAnim 0.3s ease; }
  </style>
</head>
<body>
<div id="app">
  <div id="top-bar">
    <h1>📚 Eddy 英文字卡</h1>
    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-quiz-btn" onclick="switchMode('quiz')">🃏 抽考</button>
      <button class="mode-btn" id="mode-study-btn" onclick="switchMode('study')">📖 背誦</button>
    </div>
  </div>

  <div id="progress-wrap">
    <div class="progress-row">
      <span id="prog-label">第 1 張，共 80 張</span>
      <span id="prog-pct">1%</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-fill" style="width:1.25%"></div></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="screen active" id="screen-quiz">
    <div id="quiz-scores">
      <div class="score-box green"><div class="s-label">✅ 認識</div><div class="s-num" id="q-know">0</div></div>
      <div class="score-box red"><div class="s-label">❌ 不熟</div><div class="s-num" id="q-dunno">0</div></div>
      <div class="score-box"><div class="s-label">🔀 剩餘</div><div class="s-num" id="q-remain">80</div></div>
    </div>
    <div id="quiz-card-area">
      <div class="flip-wrapper" id="flip-wrapper">
        <div class="flip-inner" id="flip-inner">
          <div class="flip-face flip-front" onclick="doFlip()">
            <div class="flip-badge" id="q-badge">字彙</div>
            <div class="flip-word" id="q-word"></div>
            <div class="flip-phonetic" id="q-phonetic"></div>
            <div class="flip-hint">輕觸翻面 👆 &nbsp;·&nbsp; 翻後左滑不熟 / 右滑認識</div>
          </div>
          <div class="flip-face flip-back">
            <div class="flip-back-content">
              <div class="flip-pos-tag" id="q-pos-tag"></div>
              <div class="flip-meaning" id="q-meaning"></div>
              <div class="flip-ex" id="q-ex"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="swipe-hint">← 左滑「不熟」&nbsp;｜&nbsp;「認識」右滑 →</div>
    <div id="quiz-actions">
      <button id="btn-flip" onclick="doFlip()">翻面看答案</button>
      <div class="judge-row" id="judge-row">
        <button class="judge-btn dunno" onclick="judge(false)">← 還不熟</button>
        <button class="judge-btn know" onclick="judge(true)">認識！→</button>
      </div>
    </div>
  </div>

  <!-- STUDY SCREEN -->
  <div class="screen" id="screen-study">
    <div id="study-scroll">
      <div class="study-card" id="study-card">
        <!-- Header: word / phonetic / meaning each on own line -->
        <div class="s-header">
          <span class="s-word" id="s-word"></span>
          <span class="s-phonetic" id="s-phonetic"></span>
          <div class="s-pos-row">
            <span class="s-pos" id="s-pos"></span>
            <span class="s-meaning-inline" id="s-meaning"></span>
          </div>
        </div>
        <!-- Example -->
        <div class="s-block">
          <div class="s-section-label">💬 英文例句</div>
          <div class="s-en" id="s-en"></div>
          <div class="s-zh" id="s-zh"></div>
        </div>
        <!-- Synonyms & Antonyms -->
        <div class="s-block" id="s-syn-ant-block">
          <div class="s-section-label">🔗 近義詞 / 反義詞</div>
          <div class="syn-ant-grid">
            <div class="syn-box">
              <div class="syn-ant-title">近義詞 Synonyms</div>
              <div class="syn-ant-en" id="s-syn-en"></div>
              <div class="syn-ant-zh" id="s-syn-zh"></div>
            </div>
            <div class="ant-box">
              <div class="syn-ant-title">反義詞 Antonyms</div>
              <div class="syn-ant-en" id="s-ant-en"></div>
              <div class="syn-ant-zh" id="s-ant-zh"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="study-nav">
      <button class="nav-btn" id="s-prev" onclick="studyNav(-1)">← 上一張</button>
      <button class="nav-btn primary" id="s-next" onclick="studyNav(1)">下一張 →</button>
    </div>
  </div>

  <div id="tab-bar">
    <button class="tab-btn active" id="tab-quiz" onclick="switchMode('quiz')">
      <span class="tab-icon">🃏</span>隨機抽考
    </button>
    <button class="tab-btn" id="tab-study" onclick="switchMode('study')">
      <span class="tab-icon">📖</span>完整背誦
    </button>
    <button class="tab-btn" onclick="onShuffle()">
      <span class="tab-icon">🔀</span>重新洗牌
    </button>
  </div>
</div>

<div id="finish-overlay">
  <div class="fin-emoji" id="fin-emoji">🎉</div>
  <div class="fin-title">完成！</div>
  <div class="fin-msg" id="fin-msg"></div>
  <div class="fin-btns">
    <button class="fin-btn secondary" id="fin-retry" onclick="retryWrong()">再練不熟的</button>
    <button class="fin-btn primary" onclick="restartAll()">重新開始</button>
  </div>
</div>

<script>
// ─── Data Format ─────────────────────────────────────────────────────────────
// [word, posLabel, meaning, phonetic, enEx, zhEx, synEn, synZh, antEn, antZh]
// synEn/antEn: English synonyms/antonyms  |  synZh/antZh: Chinese equivalents
// Use "" for phonetic on phrases; use "—" when no synonym/antonym exists

const CARDS = [
  ["position","/pəˈzɪʃən/","n.","位置；職位；姿勢","She applied for a marketing position at the company.","她應徵了那家公司的行銷職位。","location, role, post","位置、角色、職務","—","—"],
  ["dermatologist","/ˌdɜːrməˈtɒlədʒɪst/","n.","皮膚科醫師","I made an appointment with a dermatologist about my skin rash.","我因為皮膚疹預約了皮膚科醫師。","skin specialist","皮膚科醫師","general practitioner","一般科醫師"],
  ["in no time","","副詞片語","很快；立刻","The update finished in no time.","更新很快就完成了。","quickly, immediately, at once","很快、立刻","slowly, eventually","緩慢地、最終"],
  ["filler","/ˈfɪlər/","n.","填充詞；贅詞","Try to replace fillers such as 'um' with a short pause.","試著用短暫停頓取代像 um 這樣的填充詞。","placeholder, padding word","佔位詞","key word, content word","關鍵字、實詞"],
  ["Pretty good, you?","","口語","還不錯，你呢？","Pretty good, you? How has your morning been?","還不錯，你呢？你今天早上過得如何？","Not bad, you? / How about you?","還不錯，你呢？","—","—"],
  ["Solid day so far.","","口語","今天到目前為止過得不錯","Solid day so far. I finished everything on my list.","到目前為止今天過得挺順利。","Good day so far. / Productive day.","今天還蠻順的。","Rough day. / Bad day.","今天很難熬。"],
  ["Can't complain.","","口語","沒什麼好抱怨的；還不錯","Can't complain. Work has been busy but manageable.","沒什麼好抱怨的，工作雖忙但還能應付。","Not bad. / Pretty good.","還不錯。","Could be better. / It's been rough.","還可以更好。"],
  ["Not bad at all.","","口語","一點也不差；相當不錯","The new phone is not bad at all for the price.","以這個價格來說，這支手機相當不錯。","Pretty good. / Quite impressive.","相當不錯。","Terrible. / Awful.","很糟糕。"],
  ["I'm doing alright.","","口語","我過得還可以","I'm doing alright, although this week has been busy.","我過得還可以，雖然這星期很忙。","I'm fine. / I'm okay. / Not bad.","我還不錯。","I'm struggling. / I'm exhausted.","我很掙扎。"],
  ["domestic flight","","名詞片語","國內線航班","We took a domestic flight from Taipei to Kaohsiung.","我們搭乘國內線航班從台北前往高雄。","internal flight, local flight","國內航班","international flight","國際航班"],
  ["flip","/flɪp/","v.","翻轉；迅速翻動","You can flip the foldable phone open with one hand.","你可以用一隻手把摺疊手機翻開。","turn over, rotate, toss","翻轉、旋轉","keep still, remain fixed","保持不動"],
  ["strap","/stræp/","n.","帶子；背帶","Make sure the luggage strap is secure before your flight.","搭機前請確認行李束帶已固定好。","belt, band, tie","帶子、繫帶","—","—"],
  ["old version","","名詞片語","舊版本","The old version of the app no longer receives updates.","這個應用程式的舊版本已不再收到更新。","previous version, outdated version","舊版、過時版本","new version, latest version","新版、最新版本"],
  ["outdated","/ˌaʊtˈdeɪtɪd/","adj.","過時的；已淘汰的","This charging cable will soon become outdated.","這條充電線很快就會過時。","obsolete, old-fashioned, out-of-date","過時的、老舊的","current, up-to-date, modern","現代的、最新的"],

// ─── Font size helper — keeps word on ONE line ────────────────────────────────
function fitWordFont(el, word) {
  const len = word.length;
  let size;
  if (len <= 6)       size = '2.1rem';
  else if (len <= 9)  size = '1.85rem';
  else if (len <= 12) size = '1.55rem';
  else if (len <= 16) size = '1.25rem';
  else if (len <= 22) size = '1.05rem';
  else if (len <= 30) size = '0.88rem';
  else                size = '0.75rem';
  el.style.fontSize = size;
}

// ─── POS colour helper ────────────────────────────────────────────────────────
function posStyle(posLabel) {
  const p = posLabel.trim().toLowerCase();
  if (p.startsWith('n.'))    return { bg:'rgba(59,130,246,0.15)',  color:'#60a5fa' };
  if (p.startsWith('v.'))    return { bg:'rgba(34,197,94,0.15)',   color:'#4ade80' };
  if (p.startsWith('adj.'))  return { bg:'rgba(234,179,8,0.15)',   color:'#fbbf24' };
  if (p.includes('片語') || p.includes('phrasal')) return { bg:'rgba(168,85,247,0.15)', color:'#c084fc' };
  if (p.includes('名詞片語')) return { bg:'rgba(59,130,246,0.12)', color:'#93c5fd' };
  if (p.includes('動詞片語')) return { bg:'rgba(34,197,94,0.12)',  color:'#86efac' };
  if (p.includes('口語'))    return { bg:'rgba(236,72,153,0.15)',  color:'#f472b6' };
  if (p.includes('諺語'))    return { bg:'rgba(20,184,166,0.15)',  color:'#2dd4bf' };
  if (p.includes('副詞'))    return { bg:'rgba(251,146,60,0.15)',  color:'#fb923c' };
  return { bg:'rgba(148,163,184,0.15)', color:'#94a3b8' };
}

// ─── State ────────────────────────────────────────────────────────────────────
let qDeck=[], qIdx=0, qKnow=0, qDunno=0, qFlipped=false, wrongCards=[];
let sIdx=0;
let mode='quiz';
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b; };

// ─── Progress ─────────────────────────────────────────────────────────────────
function setProgress(idx, total) {
  const pct = Math.round(((idx+1)/total)*100);
  document.getElementById('prog-label').textContent = `第 ${idx+1} 張，共 ${total} 張`;
  document.getElementById('prog-pct').textContent = `${pct}%`;
  document.getElementById('prog-fill').style.width = `${Math.max(pct,1)}%`;
}

// ─── Quiz ─────────────────────────────────────────────────────────────────────
function initQuiz(cards) {
  qDeck=shuffle(cards); qIdx=0; qKnow=0; qDunno=0; wrongCards=[];
  document.getElementById('finish-overlay').classList.remove('show');
  updateScores(); showQCard();
}
function showQCard() {
  if(qIdx>=qDeck.length){showFinish();return;}
  const c=qDeck[qIdx];
  // [0]=word [1]=phonetic [2]=pos [3]=meaning [4]=enEx [5]=zhEx
  const wordEl=document.getElementById('q-word');
  wordEl.textContent=c[0];
  fitWordFont(wordEl, c[0]);

  const phonEl=document.getElementById('q-phonetic');
  phonEl.textContent=c[1]||'';
  phonEl.style.display=c[1]?'block':'none';

  document.getElementById('q-badge').textContent=c[2]||'字彙';
  document.getElementById('q-pos-tag').textContent=c[2];
  document.getElementById('q-meaning').textContent=c[3];
  document.getElementById('q-ex').textContent=c[4]?`"${c[4]}"` : '';

  qFlipped=false;
  document.getElementById('flip-inner').classList.remove('flipped');
  document.getElementById('btn-flip').style.display='';
  document.getElementById('judge-row').classList.remove('show');
  setProgress(qIdx, qDeck.length);

  const w=document.getElementById('flip-wrapper');
  w.classList.remove('anim-in','anim-pop','anim-shake'); void w.offsetWidth; w.classList.add('anim-in');
}
function doFlip() {
  if(qFlipped)return;
  qFlipped=true;
  document.getElementById('flip-inner').classList.add('flipped');
  setTimeout(()=>{
    document.getElementById('btn-flip').style.display='none';
    document.getElementById('judge-row').classList.add('show');
  },280);
}
function judge(knew) {
  const w=document.getElementById('flip-wrapper');
  if(knew){
    qKnow++;
    w.classList.remove('anim-pop'); void w.offsetWidth; w.classList.add('anim-pop');
  } else {
    qDunno++;
    wrongCards.push(qDeck[qIdx]);
    w.classList.remove('anim-shake'); void w.offsetWidth; w.classList.add('anim-shake');
  }
  updateScores(); qIdx++;
  setTimeout(showQCard, 320);
}
function updateScores() {
  document.getElementById('q-know').textContent=qKnow;
  document.getElementById('q-dunno').textContent=qDunno;
  document.getElementById('q-remain').textContent=Math.max(0,qDeck.length-qIdx);
}
function showFinish() {
  const total=qKnow+qDunno, pct=total?Math.round(qKnow/total*100):0;
  const emoji=pct>=90?'🏆':pct>=70?'🎯':pct>=50?'💪':'📚';
  document.getElementById('fin-emoji').textContent=emoji;
  document.getElementById('fin-msg').textContent=`認識 ${qKnow} / ${total} 個（${pct}%）\n${wrongCards.length>0?`還有 ${wrongCards.length} 個需要加強！`:'全部掌握，太厲害了 🎉'}`;
  document.getElementById('fin-retry').style.display=wrongCards.length?'':'none';
  document.getElementById('finish-overlay').classList.add('show');
}
function retryWrong(){ document.getElementById('finish-overlay').classList.remove('show'); initQuiz(wrongCards.length?wrongCards:CARDS); }
function restartAll(){ document.getElementById('finish-overlay').classList.remove('show'); initQuiz(CARDS); }

// ─── Study ────────────────────────────────────────────────────────────────────
function showSCard() {
  const c=CARDS[sIdx];
  // [0]=word [1]=phonetic [2]=pos [3]=meaning [4]=enEx [5]=zhEx [6]=synEn [7]=synZh [8]=antEn [9]=antZh

  // Word — single line, auto font
  const wordEl=document.getElementById('s-word');
  wordEl.textContent=c[0];
  fitWordFont(wordEl, c[0]);

  // Phonetic — own line
  const phonEl=document.getElementById('s-phonetic');
  phonEl.textContent=c[1]||'';
  phonEl.style.display=c[1]?'block':'none';

  // POS badge
  const posEl=document.getElementById('s-pos');
  posEl.textContent=c[2];
  const st=posStyle(c[2]);
  posEl.style.background=st.bg; posEl.style.color=st.color;

  // Meaning
  document.getElementById('s-meaning').textContent=c[3];

  // Example
  document.getElementById('s-en').textContent=c[4]?`"${c[4]}"` : '';
  document.getElementById('s-zh').textContent=c[5]?`→ ${c[5]}` : '';

  // Synonyms
  const synEn=c[6]||'', antEn=c[8]||'';
  document.getElementById('s-syn-en').textContent=synEn==='—'?'':synEn;
  document.getElementById('s-syn-zh').textContent=(c[7]&&c[7]!=='—')?c[7]:'';
  document.getElementById('s-ant-en').textContent=antEn==='—'?'':antEn;
  document.getElementById('s-ant-zh').textContent=(c[9]&&c[9]!=='—')?c[9]:'';

  // If both no data, show "—"
  if(synEn==='—'||!synEn){ document.getElementById('s-syn-en').innerHTML='<span class="no-data">—</span>'; }
  if(antEn==='—'||!antEn){ document.getElementById('s-ant-en').innerHTML='<span class="no-data">—</span>'; }

  // Navigation
  document.getElementById('s-prev').disabled=sIdx===0;
  document.getElementById('s-next').textContent=sIdx===CARDS.length-1?'回到第一張 ↩':'下一張 →';
  setProgress(sIdx, CARDS.length);

  document.getElementById('study-scroll').scrollTop=0;
  const card=document.getElementById('study-card');
  card.classList.remove('anim-in'); void card.offsetWidth; card.classList.add('anim-in');
}
function studyNav(d) {
  const n=sIdx+d;
  sIdx=n<0?0:n>=CARDS.length?0:n;
  showSCard();
}

// ─── Mode / Shuffle ───────────────────────────────────────────────────────────
function switchMode(m) {
  mode=m;
  ['quiz','study'].forEach(x=>{
    document.getElementById(`screen-${x}`).classList.toggle('active',x===m);
    document.getElementById(`mode-${x}-btn`).classList.toggle('active',x===m);
    document.getElementById(`tab-${x}`).classList.toggle('active',x===m);
  });
  if(m==='study') showSCard();
  else setProgress(qIdx, qDeck.length);
}
function onShuffle() {
  if(mode==='quiz') initQuiz(CARDS);
  else { sIdx=0; showSCard(); }
}

// ─── Touch Swipe ──────────────────────────────────────────────────────────────
let tx=0;
document.getElementById('quiz-card-area').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('quiz-card-area').addEventListener('touchend',e=>{
  if(!qFlipped)return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>55) judge(dx>0);
},{passive:true});
document.getElementById('study-scroll').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('study-scroll').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>65) studyNav(dx>0?-1:1);
},{passive:true});

// ─── Keyboard ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(mode==='quiz'){
    if(e.key===' ') doFlip();
    if(e.key==='ArrowRight'&&qFlipped) judge(true);
    if(e.key==='ArrowLeft'&&qFlipped) judge(false);
  }
  if(mode==='study'){
    if(e.key==='ArrowRight') studyNav(1);
    if(e.key==='ArrowLeft') studyNav(-1);
  }
});

// ─── Service Worker ───────────────────────────────────────────────────────────
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ─── Init ─────────────────────────────────────────────────────────────────────
initQuiz(CARDS);
showSCard();
</script>
</body>
</html>
