<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="口說Chunks">
  <meta name="theme-color" content="#0f0f13">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Eddy 口說 Chunks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13; --card-bg: #1a1a24; --card-2: #20202d; --border: #2a2a3a;
      --primary: #6366f1; --primary-soft: rgba(99,102,241,0.15); --primary-text: #a5b4fc;
      --amber: #f59e0b; --amber-soft: rgba(245,158,11,0.14);
      --green: #22c55e; --red: #ef4444;
      --text: #f1f1f5; --muted: #8b8b9e;
      --radius: 20px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    html, body {
      height: 100%; width: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang TC', 'Noto Sans TC', 'Segoe UI', sans-serif;
      overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
      overscroll-behavior: none; touch-action: manipulation;
    }
    /* 鎖住整個頁面：只有內容區能捲動，畫面不會整片被拖動 */
    body { position: fixed; inset: 0; }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    #app { display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; padding-left: var(--safe-left); padding-right: var(--safe-right); }

    /* ── Top bar ── */
    #top-bar {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: calc(var(--safe-top) + 10px) 16px 10px; border-bottom: 1px solid var(--border); background: var(--bg);
    }
    #top-bar h1 { font-size: 0.98rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
    #top-bar h1 small { font-weight: 600; color: var(--muted); font-size: 0.72rem; margin-left: 6px; }
    .icon-btn {
      width: 36px; height: 36px; flex: 0 0 36px; display: grid; place-items: center;
      border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg); font-size: 1rem;
    }
    .icon-btn:active, .icon-btn.on { background: var(--primary); border-color: var(--primary); }
    .top-tabs { display: none; gap: 3px; background: var(--card-bg); border-radius: 12px; padding: 3px; border: 1px solid var(--border); }
    .top-tabs button { border: 0; background: transparent; color: var(--muted); font-size: 0.8rem; font-weight: 700; padding: 7px 14px; border-radius: 9px; white-space: nowrap; }
    .top-tabs button.active { background: var(--primary); color: #fff; }

    /* ── Family pills ── */
    #fam-bar {
      display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; flex-shrink: 0;
      border-bottom: 1px solid var(--border); scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    #fam-bar::-webkit-scrollbar { display: none; }
    #app[data-view="talk"] #fam-bar, #app[data-view="catch"] #fam-bar { display: none; }
    .dpill {
      padding: 6px 13px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
      border: 1.5px solid var(--border); background: var(--card-bg); color: var(--muted); white-space: nowrap; transition: all .18s;
    }
    .dpill.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* ── Body layout ── */
    #body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #side { flex-shrink: 0; max-height: 0; overflow: hidden; transition: max-height .3s ease; border-bottom: 1px solid transparent; }
    #app.player-open #side { max-height: 75vh; overflow-y: auto; border-bottom-color: var(--border); }
    .side-inner { padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; }
    .player-box { width: 100%; max-width: 640px; margin: 0 auto; }
    .player-frame { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
    .player-frame iframe, .player-frame #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .player-ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: .8rem; text-align: center; padding: 16px; }
    .player-meta { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; }
    .pm-title { font-size: 0.82rem; font-weight: 700; line-height: 1.35; flex: 1; }
    .pm-sub { font-size: 0.7rem; color: var(--muted); margin-top: 2px; font-weight: 500; }
    .pm-link { font-size: 0.7rem; color: var(--primary-text); text-decoration: none; white-space: nowrap; padding-top: 2px; }
    .chapters { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; padding-bottom: 2px; }
    .chapters::-webkit-scrollbar { display: none; }
    .chap { flex-shrink: 0; border: 1px solid var(--border); background: var(--card-bg); border-radius: 8px; padding: 5px 9px; font-size: .68rem; color: var(--muted); white-space: nowrap; }
    .chap b { color: var(--text); font-weight: 700; margin-right: 4px; }
    .chap:active { border-color: var(--primary); }
    .side-extra { display: none; }

    #main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .view { display: none; padding: 16px 16px 28px; max-width: 1100px; margin: 0 auto; }
    .view.active { display: block; }

    /* ── Bottom tab bar ── */
    #tabbar {
      flex-shrink: 0; display: grid; grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border); background: rgba(15,15,19,0.96);
      padding: 6px 6px calc(var(--safe-bottom) + 6px);
    }
    #tabbar button { border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px; border-radius: 12px; min-height: 50px; }
    #tabbar .t-ico { font-size: 1.25rem; line-height: 1; }
    #tabbar .t-lbl { font-size: 0.66rem; font-weight: 700; }
    #tabbar button.active { color: #fff; background: var(--primary-soft); }
    #tabbar button.active .t-lbl { color: var(--primary-text); }

    /* ── Generic ── */
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
    .sec-title { font-size: .72rem; font-weight: 800; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
    .seg { display: inline-flex; gap: 3px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
    .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 9px; font-size: .76rem; font-weight: 700; white-space: nowrap; }
    .seg button.active { background: var(--primary); color: #fff; }
    .btn { border: 1px solid var(--border); background: var(--card-bg); border-radius: 11px; padding: 9px 14px; font-size: .82rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
    .btn:active { opacity: .8; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.green { background: rgba(34,197,94,.14); border-color: rgba(34,197,94,.5); color: #86efac; }
    .btn.red { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.5); color: #fca5a5; }
    .btn.danger { color: #fca5a5; }
    .btn.sm { padding: 6px 10px; font-size: .74rem; border-radius: 9px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    mark.hl { background: rgba(99,102,241,.28); color: #fff; border-radius: 5px; padding: 0 3px; font-weight: 700; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    mark.hl-amber { background: var(--amber-soft); color: #fcd34d; border-radius: 5px; padding: 0 3px; font-weight: 700; }
    .ts { border: 1px solid var(--border); background: var(--bg); color: var(--primary-text); border-radius: 8px; padding: 3px 8px; font-size: .7rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ts.sm { padding: 1px 6px; font-size: .66rem; margin-left: 6px; vertical-align: 1px; }
    .ts:active { background: var(--primary); color: #fff; }
    .pbtn { border: 1px solid var(--border); background: var(--primary-soft); border-radius: 10px; padding: 7px 12px; font-size: .76rem; font-weight: 700; }
    .pbtn.playing, .mini.playing, .pbtn:active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .mini { width: 30px; height: 30px; flex: 0 0 30px; border: 1px solid var(--border); background: var(--primary-soft); border-radius: 8px; font-size: .8rem; display: grid; place-items: center; }
    .mini.rec { background: var(--red); border-color: var(--red); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .55; } }
    .empty { text-align: center; padding: 40px 16px; color: var(--muted); font-size: .9rem; line-height: 1.7; }
    .empty .big { font-size: 2.4rem; display: block; margin-bottom: 8px; }

    /* ── Dashboard ── */
    .dash { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat { background: var(--card-bg); border: 1px solid var(--border); border-radius: 13px; padding: 9px 6px; text-align: center; }
    .stat .s-num { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat .s-lbl { font-size: .6rem; font-weight: 700; color: var(--muted); margin-top: 1px; }
    .stat.amber .s-num { color: var(--amber); }
    .stat.green .s-num { color: var(--green); }
    .stat.indigo .s-num { color: var(--primary-text); }
    .bar { height: 4px; background: var(--border); border-radius: 999px; margin-top: 10px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--green)); border-radius: 999px; transition: width .4s; }

    /* ── Notes ── */
    .intro { background: linear-gradient(135deg, #1e1b4b 0%, #1a1a24 70%); border: 1px solid rgba(99,102,241,.4); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
    .intro summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .intro summary::-webkit-details-marker { display: none; }
    .intro summary h2 { font-size: 1rem; flex: 1; line-height: 1.4; }
    .intro summary .chev { color: var(--muted); transition: transform .2s; }
    .intro[open] summary .chev { transform: rotate(90deg); }
    .intro .core { font-size: .84rem; line-height: 1.7; color: #d4d4e0; margin: 10px 0 4px; }
    .concepts { display: grid; gap: 10px; margin-top: 12px; }
    .concept { background: rgba(15,15,19,.55); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .concept h4 { font-size: .86rem; margin-bottom: 5px; }
    .concept p { font-size: .8rem; line-height: 1.7; color: #c9c9d6; }
    .concept .quote { display: block; margin-top: 6px; color: #fcd34d; font-weight: 700; font-size: .8rem; }
    .notes-dash { margin-bottom: 14px; }
    .today5 { margin-bottom: 14px; }
    .today5-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .today5-head h3 { font-size: .9rem; flex: 1; }
    .slots { display: flex; gap: 6px; flex-wrap: wrap; }
    .slot { border: 1.5px dashed var(--border); border-radius: 10px; padding: 6px 10px; font-size: .74rem; color: var(--muted); min-width: 64px; text-align: center; background: transparent; }
    .slot.filled { border-style: solid; border-color: rgba(245,158,11,.55); color: #fcd34d; background: var(--amber-soft); font-weight: 700; }
    .search { position: relative; margin-bottom: 14px; }
    .search input { width: 100%; padding: 11px 12px 11px 36px; font: inherit; font-size: 16px; color: var(--text); background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; }
    .search::before { content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: .85rem; opacity: .7; }
    .fam-head { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; }
    .fam-head:first-child { margin-top: 4px; }
    .fam-num { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; background: var(--primary-soft); color: var(--primary-text); flex-shrink: 0; }
    .fam-head h2 { font-size: 1rem; line-height: 1.25; }
    .fam-head h2 small { display: block; font-size: .7rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .fam-head .ts { margin-left: auto; }
    .fam-desc { font-size: .78rem; color: var(--muted); line-height: 1.6; margin: -4px 0 12px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

    .ccard { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color .3s, box-shadow .3s; scroll-margin-top: 16px; }
    .ccard.flash-hl { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.3); }
    .c-head { display: flex; align-items: center; gap: 6px; }
    .badge { font-size: .62rem; font-weight: 800; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-text); white-space: nowrap; }
    .lvl { font-size: .55rem; letter-spacing: 1px; color: var(--green); margin-left: 2px; }
    .c-head .ts { margin-left: auto; }
    .star { border: 0; background: transparent; font-size: 1.25rem; color: var(--muted); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; }
    .star.on { color: var(--amber); }
    .written { font-size: 1.45rem; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
    .written .cno { font-size: .78rem; color: var(--muted); font-weight: 700; margin-right: 6px; vertical-align: 3px; }
    .spoken { align-self: flex-start; background: var(--amber-soft); color: #fcd34d; border: 1px solid rgba(245,158,11,.45); border-radius: 10px; padding: 5px 10px; font-size: .84rem; font-weight: 700; }
    .say-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .meaning { font-size: .95rem; font-weight: 700; line-height: 1.55; }
    .tip { background: rgba(15,15,19,.6); border-left: 3px solid var(--amber); border-radius: 8px; padding: 9px 11px; font-size: .8rem; line-height: 1.65; color: #d4d4e0; }
    .ex { list-style: none; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
    .ex li { display: flex; flex-direction: column; gap: 3px; }
    .ex-en { display: flex; gap: 8px; align-items: flex-start; font-size: .92rem; line-height: 1.5; }
    .ex-en span { padding-top: 4px; }
    .ex-zh { font-size: .76rem; color: var(--muted); padding-left: 38px; line-height: 1.5; }

    /* ── Flashcards ── */
    .flash-wrap { display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
    .flash-ctrl { display: flex; gap: 8px; justify-content: space-between; overflow-x: auto; scrollbar-width: none; }
    .flash-ctrl::-webkit-scrollbar { display: none; }
    .flash-ctrl .seg { flex-shrink: 0; }
    .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .scores .stat { padding: 5px 6px; display: flex; align-items: baseline; justify-content: center; gap: 6px; }
    .scores .s-num { font-size: 1.05rem; }
    .card-area { perspective: 1200px; display: flex; justify-content: center; padding: 4px 0; }
    .flip-wrapper { width: 100%; max-width: 560px; height: clamp(260px, calc(100dvh - 430px - var(--safe-top) - var(--safe-bottom)), 460px); position: relative; touch-action: pan-y; }
    .flip-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); }
    .flip-inner.flipped { transform: rotateY(180deg); }
    .flip-wrapper.swipe-r .flip-inner { box-shadow: 0 0 0 3px var(--green); border-radius: var(--radius); }
    .flip-wrapper.swipe-l .flip-inner { box-shadow: 0 0 0 3px var(--red); border-radius: var(--radius); }
    .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
    .flip-front { background: var(--card-bg); border: 1px solid var(--border); justify-content: center; align-items: center; text-align: center; cursor: pointer; }
    .flip-back { background: linear-gradient(135deg, #1e1b4b, #1a1a30); border: 1.5px solid rgba(99,102,241,.5); transform: rotateY(180deg); gap: 10px; }
    .flip-front .badge { position: absolute; top: 16px; left: 16px; }
    .flip-front .counter { position: absolute; top: 16px; right: 16px; font-size: .72rem; color: var(--muted); font-weight: 700; }
    .q-zh { font-size: 1.35rem; font-weight: 800; line-height: 1.5; max-width: 420px; }
    .q-hint { font-size: .78rem; color: var(--muted); margin-top: 12px; }
    .big-play { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; font-size: 2.2rem; box-shadow: 0 10px 30px rgba(99,102,241,.4); }
    .big-play.playing { animation: pulse 1s infinite; }
    .tap-hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: .7rem; color: var(--muted); }
    .flip-back .written { font-size: 1.5rem; }
    .flip-back .ex-zh { padding-left: 0; }
    .flash-btns { display: grid; grid-template-columns: 48px 1fr 1fr 48px; gap: 8px; max-width: 560px; width: 100%; margin: 0 auto; }
    .flash-btns .btn { min-height: 52px; font-size: .9rem; }
    .kbd-hint { text-align: center; font-size: .7rem; color: var(--muted); display: none; }
    kbd { font-family: inherit; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: .68rem; background: var(--card-bg); }

    /* ── Talk ── */
    .talk-top { display: flex; justify-content: center; margin-bottom: 14px; }
    .ctrl-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .ctrl-bar .spacer { flex: 1; }
    .lbl { font-size: .7rem; color: var(--muted); font-weight: 700; }
    .chat { display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 88%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px 18px 18px 6px; padding: 11px 13px; display: flex; flex-direction: column; gap: 6px; transition: border-color .2s, box-shadow .2s; }
    .bubble.B { align-self: flex-end; border-radius: 18px 18px 6px 18px; background: #1e1b4b; border-color: rgba(99,102,241,.45); }
    .bubble.now { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,.25); }
    .b-head { display: flex; align-items: center; gap: 6px; font-size: .68rem; font-weight: 800; color: var(--muted); }
    .b-head .spk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--border); color: #fff; }
    .bubble.B .b-head .spk { background: var(--primary); }
    .b-head .ts { margin-left: auto; }
    .b-en { font-size: .95rem; line-height: 1.55; transition: filter .2s; }
    .b-zh { font-size: .78rem; color: var(--muted); line-height: 1.5; }
    .hide-en .b-en:not(.reveal), .hide-en .sh-en:not(.reveal) { filter: blur(7px); cursor: pointer; user-select: none; }
    .chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .chip { font-size: .64rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-text); }

    .sh-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .sh-row { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; transition: border-color .2s, background .2s; cursor: pointer; }
    .sh-row.cursor { border-color: rgba(99,102,241,.6); }
    .sh-row.now { border-color: var(--amber); background: #221d14; }
    .sh-no { width: 28px; height: 28px; border-radius: 8px; background: var(--bg); display: grid; place-items: center; font-size: .72rem; font-weight: 800; color: var(--muted); }
    .sh-row.now .sh-no { background: var(--amber); color: #111; }
    .sh-en { font-size: .92rem; font-weight: 600; line-height: 1.45; }
    .sh-sp { font-size: .74rem; color: #fcd34d; margin-top: 2px; }
    .sh-zh { font-size: .74rem; color: var(--muted); margin-top: 2px; }
    .sh-act { display: flex; gap: 6px; align-items: center; }
    .turn { position: sticky; top: 0; z-index: 3; margin: -4px 0 12px; background: #221d14; border: 1px solid rgba(245,158,11,.5); border-radius: 12px; padding: 9px 12px; font-size: .8rem; font-weight: 700; color: #fcd34d; display: none; }
    .turn.show { display: block; }
    .turn .bar > i { background: var(--amber); transition: none; }

    /* ── Catch ── */
    .catch-card { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

    @media (max-width: 767px) {

      .toc-fam > button:hover { background: var(--card-2); }

  </style>

<script src="data.js"></script>
<script>
'use strict';
/* ════════════ 資料 ════════════ */
const D = window.CHUNKS_DATA;
if (!D) { document.body.innerHTML = '<p style="padding:40px;color:#fff">找不到 data.js，請確認檔案與 index.html 放在同一個資料夾。</p>'; throw new Error('no data'); }
const FAM = Object.fromEntries(D.families.map(f => [f.id, f]));
const CONCEPTS = [
  { icon: '🧩', t: '什麼是 Chunk（語塊 / Word Team）？', p: '母語者說話不會 word by word 一個字一個字唸，而是把常一起出現的字連成「聲音群組（sound groups）」與「意義群組（meaning groups）」。', q: '“Chunks are word teams.”' },
  { icon: '🌊', t: '為什麼單字都認識卻聽不懂？', p: '課本英文（textbook English）和真實口語（real spoken English）不一樣：連音、弱讀形成了特定的「聲音形狀（sound shapes）」。快語速英文原本像一條大河，學會 chunks 後，你能看見河上的一艘艘小船。', q: '“Chunks are small boats in the river.”' },
  { icon: '🎯', t: '學習者的黃金原則', p: '說可以慢而清楚，但聽必須認出快語塊。不必模仿電影演員講很快，先求聽懂。每天挑 5 個 chunks 重複跟讀、造短句。', q: '“Speak clearly, listen for fast chunks.”' }
];
const CHAPTERS = [
  ['開場觀念', 0], ['F1 問句', 125], ['F2 日常', 263], ['F3 回應', 434], ['F4 開場', 556], ['F5 時間', 725],
  ['為什麼重要', 842], ['聽力抓塊', 950], ['實戰對話', 1014], ['19 句跟讀', 1062], ['總結', 1135]
];

/* ════════════ 工具 ════════════ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = t => { t = Math.floor(t); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad2 = n => String(n).padStart(2, '0');
const isDesktop = () => matchMedia('(min-width: 1025px)').matches;
function today(d = new Date()) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(ds, n) { const [y, m, d] = ds.split('-').map(Number); return today(new Date(y, m - 1, d + n)); }
function core(s) { return s.replace(/\(.*?\)/g, '').replace(/\+\s*\[.*?\]/g, '').replace(/\.\.\./g, '').replace(/…/g, '').replace(/[?.!]/g, '').trim(); }
function famShort(f) { return f.titleZh.replace(/家族$/, ''); }

D.chunks.forEach(c => {
  const set = new Set([core(c.written)]);
  c.spoken.split('/').forEach(p => { const k = core(p); if (k) set.add(k); });
  c.core = core(c.written);
  c.patterns = [...set].filter(Boolean);
  c.sayText = c.core + (/\?/.test(c.written) ? '?' : '.');
  c.hasSpoken = core(c.spoken).toLowerCase() !== c.core.toLowerCase();
});
const CHUNK = Object.fromEntries(D.chunks.map(c => [c.id, c]));
const ALL_PATTERNS = D.chunks.flatMap(c => c.patterns);

function hl(text, phrases, cls = 'hl') {
  const h = esc(text);
  const ps = [...new Set(phrases || [])].filter(Boolean).sort((a, b) => b.length - a.length)
    .map(p => esc(p).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!ps.length) return h;
  return h.replace(new RegExp('\\b(' + ps.join('|') + ')\\b', 'gi'), `<mark class="${cls}">$1</mark>`);
}

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

/* ════════════ 儲存（localStorage） ════════════ */
const KEY = 'eddy-chunks-v1';
const defaultState = () => ({ progress: {}, stars: [], days: [], settings: { rate: 1, voice: '', gap: 'auto', repeat: 1, shRate: 1, view: 'notes', deck: 'due', fmode: 'zh', talkSub: 'dialog' } });
function loadState() {
  const base = defaultState();
  try {
    const j = JSON.parse(localStorage.getItem(KEY));
    if (j && typeof j === 'object') { return { ...base, ...j, settings: { ...base.settings, ...(j.settings || {}) } }; }
  } catch (e) {}
  return base;
}
let S = loadState();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ════════════ 間隔重複（簡易 Leitner） ════════════ */
const INTV = [0, 1, 3, 7, 14, 30];
const prog = id => S.progress[id] || { box: 0, ok: 0, bad: 0, due: null };
const isDue = id => { const p = S.progress[id]; return !p || !p.due || p.due <= today(); };
const isMastered = id => prog(id).box >= 2;
function touchDay() { const t = today(); if (!S.days.includes(t)) { S.days.push(t); S.days = S.days.slice(-400); } }
function mark(id, ok) {
  const p = { box: 0, ok: 0, bad: 0, ...S.progress[id] };
  if (ok) { p.box = Math.min(p.box + 1, 5); p.ok++; p.due = addDays(today(), INTV[p.box]); }
  else { p.box = 0; p.bad++; p.due = today(); }
  p.last = today(); S.progress[id] = p; touchDay(); save(); renderDash(); renderToc();
}
function streak() {
  const set = new Set(S.days); let d = today(); if (!set.has(d)) d = addDays(d, -1);
  let n = 0; while (set.has(d)) { n++; d = addDays(d, -1); } return n;
}

/* ════════════ 語音朗讀（Web Speech API） ════════════ */
const TTS = { voice: null, run: 0 };
function enVoices() { return ('speechSynthesis' in window) ? speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)) : []; }
function pickVoice() {
  const vs = enVoices(); if (!vs.length) return;
  let v = S.settings.voice && vs.find(x => x.voiceURI === S.settings.voice);
  if (!v) {
    const pref = ['Samantha', 'Ava', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Allison', 'Alex'];
    v = pref.map(n => vs.find(x => x.name.includes(n) && /en[-_]US/i.test(x.lang))).find(Boolean) || vs.find(x => /en[-_]US/i.test(x.lang)) || vs[0];
  }
  TTS.voice = v || null; fillVoiceSelect();
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function stopSpeech() { TTS.run++; if ('speechSynthesis' in window) speechSynthesis.cancel(); $$('.playing').forEach(b => b.classList.remove('playing')); }
function speak(text, { rate, pitch = 1, btn } = {}) {
  return new Promise(res => {
    if (!('speechSynthesis' in window)) { toast('這個瀏覽器不支援語音朗讀'); return res(); }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s*\/\s*/g, ', '));
    u.lang = 'en-US'; if (TTS.voice) u.voice = TTS.voice;
    u.rate = rate || S.settings.rate || 1; u.pitch = pitch;
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(tm); btn && btn.classList.remove('playing'); res(); };
    const tm = setTimeout(fin, 2000 + text.length * 110 / u.rate);
    u.onend = fin; u.onerror = fin;
    btn && btn.classList.add('playing');
    speechSynthesis.speak(u);
  });
}
const estMs = (text, rate) => (text.split(/\s+/).length * 380) / (rate || 1) + 600;

/* ════════════ YouTube 播放器 ════════════ */
let yt = null, ytReady = false, ytWant = null;
function loadYT() {
  if (document.getElementById('yt-api')) return;
  const s = document.createElement('script'); s.id = 'yt-api'; s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('yt', {
    videoId: D.videoMeta.videoId,
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: { onReady: () => { ytReady = true; $('#player-ph') && $('#player-ph').remove(); if (ytWant != null) { doSeek(ytWant); ytWant = null; } } }
  });
};
function doSeek(t) { try { yt.seekTo(t, true); yt.playVideo(); } catch (e) {} }
function setYtLink(t) { $('#yt-link').href = `https://www.youtube.com/watch?v=${D.videoMeta.videoId}${t ? '&t=' + Math.floor(t) + 's' : ''}`; }
function seek(t) {
  stopSpeech(); setYtLink(t);
  if (!isDesktop()) openPlayer(true);
  loadYT();
  if (ytReady) doSeek(t); else ytWant = t;
  toast('🎬 跳到 ' + fmt(t));
}
function openPlayer(force) {
  const app = $('#app'); const open = force === true ? true : !app.classList.contains('player-open');
  app.classList.toggle('player-open', open); $('#btn-player').classList.toggle('on', open);
  if (open) loadYT();
}

/* ════════════ 共用：家族篩選、儀表板、目錄 ════════════ */
let curFam = 'all';
function famChunks() { return D.chunks.filter(c => curFam === 'all' || c.familyId === curFam); }
function renderFamBar() {
  const pills = [['all', `全部 (${D.chunks.length})`], ...D.families.map(f => [f.id, `${f.number}.${famShort(f).replace(/語塊$/, '')} (${D.chunks.filter(c => c.familyId === f.id).length})`])];
  $('#fam-bar').innerHTML = pills.map(([id, t]) => `<button class="dpill ${curFam === id ? 'active' : ''}" data-fam="${id}">${esc(t)}</button>`).join('');
}
function renderDash() {
  const due = D.chunks.filter(c => isDue(c.id)).length;
  const m = D.chunks.filter(c => isMastered(c.id)).length;
  const html = `<div class="dash">
      <div class="stat amber"><div class="s-num">${due}</div><div class="s-lbl">今日待複習</div></div>
      <div class="stat green"><div class="s-num">${m}<small style="font-size:.7rem;color:var(--muted)">/20</small></div><div class="s-lbl">已熟練</div></div>
      <div class="stat indigo"><div class="s-num">${streak()}</div><div class="s-lbl">連續天數 🔥</div></div>
      <div class="stat"><div class="s-num">${S.stars.length}<small style="font-size:.7rem;color:var(--muted)">/5</small></div><div class="s-lbl">⭐ 今日必背</div></div>
    </div><div class="bar"><i style="width:${m / D.chunks.length * 100}%"></i></div>`;
  $('#dash-side').innerHTML = html;
  const nd = $('#notes-dash'); if (nd) nd.innerHTML = html;
}
function renderToc() {
  $('#toc').innerHTML = D.families.map(f => {
    const cs = D.chunks.filter(c => c.familyId === f.id);
    return `<div class="toc-fam"><button data-goto-fam="${f.id}"><span class="n">${f.number}</span>${esc(famShort(f))}<span class="c">${cs.filter(c => isMastered(c.id)).length}/${cs.length}</span></button>
      <div class="toc-items">${cs.map(c => `<button data-goto="${c.id}"><span class="dot ${isMastered(c.id) ? 'd2' : (S.progress[c.id] ? 'd1' : '')}"></span>${esc(c.written)}${S.stars.includes(c.id) ? '<span class="st">★</span>' : ''}</button>`).join('')}</div></div>`;
  }).join('');
}

/* ════════════ 📚 筆記重點 ════════════ */

function flashSpeakCurrent() {

function flip() { if (!F.list.length || F.done) return; F.flipped = !F.flipped; $('#flip-inner') && $('#flip-inner').classList.toggle('flipped', F.flipped); }

function bindSwipe() {
  const w = $('#flip-wrap'); if (!w) return;
  let x0 = null, y0 = null, moved = false;
  w.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false; }, { passive: true });
  w.addEventListener('touchmove', e => {
    if (x0 == null) return; const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) moved = true;
    w.classList.toggle('swipe-r', dx > 60); w.classList.toggle('swipe-l', dx < -60);
  }, { passive: true });
  w.addEventListener('touchend', e => {
    if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    w.classList.remove('swipe-r', 'swipe-l');
    if (dx > 70) markCur(true); else if (dx < -70) markCur(false);
    if (moved) { w.dataset.noclick = '1'; setTimeout(() => delete w.dataset.noclick, 350); }
  });
  w.addEventListener('click', e => {
    if (w.dataset.noclick) return;
    if (e.target.closest('button')) { if (e.target.id === 'fc-play') { e.stopPropagation(); flashSpeakCurrent(); } return; }
    flip();
  });
}

async function playDialogue() {
  if (playing) { playing = false; stopSpeech(); renderTalk(); return; }
  playing = true; const run = ++TTS.run; renderTalk();
  const lines = D.dialoguePractice.lines;
  for (let i = 0; i < lines.length; i++) {
    if (run !== TTS.run) return;
    $$('.bubble.now').forEach(b => b.classList.remove('now'));
    const el = $('#line-' + i); el && el.classList.add('now'); el && el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    await speak(lines[i].en, { pitch: lines[i].speaker === 'B' ? 1.15 : 0.95 });
    if (run !== TTS.run) return;
    await sleep(hideEn ? estMs(lines[i].en, 1) : 500);
  }
  if (run === TTS.run) { playing = false; renderTalk(); }
}
async function playShadow() {
  if (playing) { playing = false; stopSpeech(); renderTalk(); return; }
  playing = true; TTS.run++; const run = TTS.run; renderTalk();
  const ss = D.finalShadowingSet.sentences; const st = S.settings;
  for (let i = shCursor; i < ss.length; i++) {
    for (let r = 0; r < Number(st.repeat); r++) {
      if (run !== TTS.run) return;
      shCursor = i;
      $$('.sh-row').forEach(x => x.classList.remove('now', 'cursor'));
      const row = $('#sh-' + i); row && row.classList.add('now'); row && row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('#turn').classList.remove('show');
      await speak(ss[i].en, { rate: Number(st.shRate) });
      if (run !== TTS.run) return;
      const gap = st.gap === 'auto' ? estMs(ss[i].en, Number(st.shRate)) * 1.3 + 400 : Number(st.gap) * 1000;
      const turn = $('#turn'), bar = $('#turn-bar');
      $('#turn-txt').textContent = `🗣️ 換你跟讀：第 ${i + 1} 句${Number(st.repeat) > 1 ? `（${r + 1}/${st.repeat}）` : ''}`;
      turn.classList.add('show'); const t0 = performance.now();
      while (performance.now() - t0 < gap) { if (run !== TTS.run) return; bar.style.width = ((performance.now() - t0) / gap * 100) + '%'; await sleep(50); }
    }
  }
  if (run === TTS.run) { playing = false; shCursor = 0; renderTalk(); toast('🎉 19 句跟讀完成！'); touchDay(); save(); renderDash(); }
}
async function toggleRec(i) {
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('這個瀏覽器不支援錄音'); return; }
  stopSpeech(); if (playing) { playing = false; renderTalk(); }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: rec.mimeType || 'audio/mp4' });
      if (recordings[i]) URL.revokeObjectURL(recordings[i]);
      recordings[i] = URL.createObjectURL(blob); rec = null;
      renderTalk(); new Audio(recordings[i]).play().catch(() => {});
    };
    rec.start(); const b = $(`[data-rec="${i}"]`); b && b.classList.add('rec'); toast('🎙 錄音中… 再按一次停止');
  } catch (e) { toast('無法使用麥克風：' + (e.message || e.name)); rec = null; }
}

const EXTRA_DISTRACT = ['Let me check', 'have to go', 'What do you think', 'I know what you mean', 'That sounds good', 'a little later', 'sort of', 'I need to', 'You know', 'To be honest'];
const norm = s => s.toLowerCase().replace(/[^a-z' ]/g, '').trim();
function setupCatch() { C.order = shuffle(D.listeningChallenge.map((_, i) => i)); C.i = 0; C.score = 0; prepQ(); }
function prepQ() {
  C.answered = false; C.sel = new Set(); C.showText = false;
  const q = D.listeningChallenge[C.order[C.i]]; if (!q) return;
  const sent = norm(q.sentence), tg = q.targetChunks.map(norm);
  const pool = [...new Set([...D.chunks.map(c => c.core), ...EXTRA_DISTRACT])]
    .filter(p => !tg.includes(norm(p)) && !sent.includes(norm(p)) && !tg.some(t => t.includes(norm(p)) || norm(p).includes(t)));
  const n = Math.max(6 - q.targetChunks.length, 3);
  C.opts = shuffle([...q.targetChunks, ...shuffle(pool).slice(0, n)]);
}
function renderCatch() {
  const v = $('#view-catch');
  if (!C.order.length) setupCatch();
  if (C.i >= C.order.length) {
    v.innerHTML = `<div class="catch-card"><div class="empty"><span class="big">${C.score === C.order.length ? '🏆' : '🎧'}</span><b style="color:var(--text);font-size:1.15rem">得分 ${C.score} / ${C.order.length}</b><br>${C.score === C.order.length ? '耳朵已經能抓到語塊了！' : '再聽幾次，語塊的聲音形狀會越來越清楚。'}</div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="btn-catch-again">🔀 再挑戰一次</button><button class="ts" data-seek="950">🎬 原片 15:50</button></div></div>`;
    return;
  }
  const q = D.listeningChallenge[C.order[C.i]];
  const tg = q.targetChunks.map(norm);
  const optHtml = C.opts.map(o => {
    let cls = '';
    if (C.answered) { const isT = tg.includes(norm(o)), s = C.sel.has(o); cls = isT && s ? 'right' : (!isT && s ? 'wrong' : (isT ? 'missed' : '')); }
    else if (C.sel.has(o)) cls = 'sel';
    return `<button class="opt ${cls}" data-opt="${esc(o)}">${esc(o)}</button>`;
  }).join('');
  const correct = C.answered && tg.length === C.sel.size && [...C.sel].every(s => tg.includes(norm(s)));
  v.innerHTML = `<div class="catch-card">
    <div class="q-meta"><span>第 ${C.i + 1} / ${C.order.length} 題</span><span>得分 ${C.score}</span></div>
    <div class="q-stage">
      <button class="big-play" id="btn-catch-play" aria-label="播放句子">▶</button>
      <div class="row" style="justify-content:center"><button class="btn sm" id="btn-catch-slow">🐢 慢速</button><button class="btn sm" id="btn-catch-text">${C.showText || C.answered ? '🙈 藏起句子' : '👀 偷看句子'}</button><button class="ts" data-seek="${q.time}">🎬 ${fmt(q.time)}</button></div>
      <div class="q-sentence ${C.showText || C.answered ? '' : 'hidden-text'}">${C.answered ? hl(q.sentence, q.targetChunks) : esc(q.sentence)}</div>
    </div>
    <div class="sec-title" style="margin:0">這句話裡藏了哪幾個 chunk？（可複選）</div>
    <div class="opts">${optHtml}</div>
    ${C.answered ? `<div class="reveal-box"><div class="verdict ${correct ? 'ok' : 'ng'}">${correct ? '✅ 抓到了！' : '❌ 差一點'}</div>
       正確語塊：${q.targetChunks.map(t => `<mark class="hl">${esc(t)}</mark>`).join(' + ')}<br>
       ⚡ 自然聽起來像：<mark class="hl-amber">${esc(q.spokenHint)}</mark><br><span class="muted">${esc(q.zh)}</span></div>
       <button class="btn primary" id="btn-catch-next">${C.i >= C.order.length - 1 ? '看結果 🏁' : '下一題 →'}</button>`
    : `<button class="btn primary" id="btn-catch-check" ${C.sel.size ? '' : 'disabled style="opacity:.5"'}>確認答案</button>`}
    <p class="kbd-hint"><kbd>Space</kbd> 播放 ・ <kbd>Enter</kbd> 確認 / 下一題</p>
  </div>`;
}
function playCatch(rate) { const q = D.listeningChallenge[C.order[C.i]]; if (q) speak(q.sentence, { rate, btn: $('#btn-catch-play') }); }
function checkCatch() {
  if (C.answered) { C.i++; prepQ(); renderCatch(); if (C.i < C.order.length) setTimeout(() => playCatch(), 250); return; }
  if (!C.sel.size) return;
  const q = D.listeningChallenge[C.order[C.i]], tg = q.targetChunks.map(norm);
  const ok = tg.length === C.sel.size && [...C.sel].every(s => tg.includes(norm(s)));
  if (ok) C.score++;
  C.answered = true; touchDay(); save(); renderDash(); renderCatch();
}

/* ════════════ 切換畫面 ════════════ */
function setView(v) {
  if (S.settings.view !== v) { stopSpeech(); if (playing) playing = false; }
  S.settings.view = v; save();
  $('#app').dataset.view = v;
  $$('button[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $$('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + v));
  if (v === 'notes') renderNotes();
  if (v === 'flash') { if (!F.list.length && !F.done) buildDeck(); renderFlash(); }
  if (v === 'talk') renderTalk();
  if (v === 'catch') renderCatch();
  if (v !== 'notes') $('#main').scrollTop = 0;
}

/* ════════════ 事件 ════════════ */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-shrow], .b-en, .sh-en'); if (!t) return;
  const d = t.dataset;
  if (t.matches('.b-en, .sh-en')) {
    if (t.closest('.hide-en')) { t.classList.toggle('reveal'); return; }
    const row = t.closest('[data-shrow]'); if (!row) return; return document.dispatchEvent(new CustomEvent('shrow', { detail: row }));
  }
  if (d.view) return setView(d.view);
  if (d.seek != null) return seek(Number(d.seek));
  if (d.say != null) { e.stopPropagation(); stopSpeech(); return speak(d.say, { rate: d.rate ? Number(d.rate) : undefined, pitch: d.pitch ? Number(d.pitch) : 1, btn: t }); }
  if (d.star) return toggleStar(Number(d.star));
  if (d.goto) return gotoChunk(Number(d.goto));
  if (d.gotoFam) { curFam = d.gotoFam; renderFamBar(); buildDeck(); setView('notes'); renderNotesList(); $('#main').scrollTop = 0; return; }
  if (d.fam) {
    curFam = d.fam; renderFamBar();
    buildDeck();
    if (S.settings.view === 'flash') { renderFlash(); autoListen(); } else { renderNotesList(); $('#main').scrollTop = 0; }
    return;
  }
  if (d.deck) { S.settings.deck = d.deck; save(); buildDeck(); renderFlash(); return; }
  if (d.fmode) { S.settings.fmode = d.fmode; save(); F.flipped = false; renderFlash(); autoListen(); return; }
  if (d.nav) return flashNav(Number(d.nav));
  if (d.markc != null) return markCur(d.markc === '1');
  if (d.talk) { S.settings.talkSub = d.talk; save(); stopSpeech(); playing = false; renderTalk(); return; }
  if (d.set) { S.settings[d.set] = d.val; save(); $$(`[data-set="${d.set}"]`).forEach(b => b.classList.toggle('active', b.dataset.val === d.val)); return; }
  if (d.rec != null) { e.stopPropagation(); return toggleRec(Number(d.rec)); }
  if (d.playrec != null) { e.stopPropagation(); const a = new Audio(recordings[d.playrec]); a.play().catch(() => {}); return; }
  if (d.shrow != null && !e.target.closest('button')) return selectRow(t);
  if (d.opt != null) { if (C.answered) return; C.sel.has(d.opt) ? C.sel.delete(d.opt) : C.sel.add(d.opt); renderCatch(); return; }
  switch (t.id) {
    case 'btn-player': return openPlayer();
    case 'btn-settings': return openSettings();
    case 'btn-pick5': return pick5();
    case 'btn-clear5': S.stars = []; save(); renderNotesList(); renderSlots(); renderDash(); renderToc(); return;
    case 'btn-redo': { const ids = F.again.slice(); buildDeck(ids); renderFlash(); autoListen(); return; }
    case 'btn-restart': buildDeck(); renderFlash(); autoListen(); return;
    case 'btn-play-all': return playDialogue();
    case 'btn-shadow': return playShadow();
    case 'btn-hide': hideEn = !hideEn; renderTalk(); return;
    case 'btn-catch-play': return playCatch();
    case 'btn-catch-slow': return playCatch(0.7);
    case 'btn-catch-text': C.showText = !C.showText; renderCatch(); return;
    case 'btn-catch-check': case 'btn-catch-next': return checkCatch();
    case 'btn-catch-again': setupCatch(); renderCatch(); return;
  }
});
function selectRow(row) {
  if (playing) { playing = false; stopSpeech(); }
  shCursor = Number(row.dataset.shrow); $$('.sh-row').forEach(x => x.classList.remove('cursor', 'now')); row.classList.add('cursor');
  $('#turn') && $('#turn').classList.remove('show');
  $('#btn-shadow') && ($('#btn-shadow').textContent = `▶ 從第 ${shCursor + 1} 句開始`);
}
document.addEventListener('shrow', e => selectRow(e.detail));
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select') || e.metaKey || e.ctrlKey || $('#dlg-settings').open) return;
  const v = S.settings.view;
  if (v === 'flash') {
    if (e.code === 'Space') { e.preventDefault(); flip(); }
    else if (e.key === 'ArrowRight') flashNav(1);
    else if (e.key === 'ArrowLeft') flashNav(-1);
    else if (e.key === '1') markCur(true);
    else if (e.key === '2') markCur(false);
    else if (e.key.toLowerCase() === 'p') flashSpeakCurrent();
  } else if (v === 'talk' && e.code === 'Space') { e.preventDefault(); S.settings.talkSub === 'dialog' ? playDialogue() : playShadow(); }
  else if (v === 'catch') {
    if (e.code === 'Space') { e.preventDefault(); playCatch(); }
    else if (e.key === 'Enter') { e.preventDefault(); checkCatch(); }
  }
});

/* ════════════ 設定與備份 ════════════ */
function fillVoiceSelect() {
  const sel = $('#sel-voice'); if (!sel) return;
  const vs = enVoices();
  sel.innerHTML = vs.length ? vs.map(v => `<option value="${esc(v.voiceURI)}" ${TTS.voice && v.voiceURI === TTS.voice.voiceURI ? 'selected' : ''}>${esc(v.name)} (${v.lang})</option>`).join('') : '<option>（找不到英文語音）</option>';
}
function openSettings() {
  fillVoiceSelect();
  $$('#seg-rate button').forEach(b => b.classList.toggle('active', Number(b.dataset.rate) === Number(S.settings.rate)));
  $('#dlg-settings').showModal();
}
function backupString() { return JSON.stringify({ app: 'eddy-chunks', version: 1, exportedAt: new Date().toISOString(), state: S }); }
function restore(text) {
  try {
    const j = JSON.parse(text); const st = j.state || j;
    if (!st || typeof st.progress !== 'object') throw new Error('格式不對');
    const base = defaultState();
    S = { ...base, ...st, settings: { ...base.settings, ...(st.settings || {}) } };
    save(); buildDeck(); renderAll(); toast('✅ 進度已還原'); $('#dlg-settings').close();
  } catch (e) { toast('還原失敗：' + e.message); }
}
$('#dlg-settings').addEventListener('click', e => {
  if (e.target.closest('[data-close]') || e.target === e.currentTarget) return $('#dlg-settings').close();
  const r = e.target.closest('[data-rate]');
  if (r && r.closest('#seg-rate')) { S.settings.rate = Number(r.dataset.rate); save(); $$('#seg-rate button').forEach(b => b.classList.toggle('active', b === r)); e.stopPropagation(); }
});
$('#sel-voice').addEventListener('change', e => { S.settings.voice = e.target.value; save(); pickVoice(); });
$('#btn-test-voice').addEventListener('click', e => { e.stopPropagation(); speak('Do you wanna grab coffee later?'); });
$('#btn-copy').addEventListener('click', async e => {
  e.stopPropagation(); const s = backupString();
  try { await navigator.clipboard.writeText(s); toast('📋 備份碼已複製，到另一台裝置貼上'); }
  catch (_) { $('#ta-import').value = s; $('#ta-import').select(); toast('請手動複製下方文字'); }
});
$('#btn-export').addEventListener('click', e => {
  e.stopPropagation();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backupString()], { type: 'application/json' }));
  a.download = `chunks-progress-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
});
$('#file-import').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => restore(rd.result); rd.readAsText(f); e.target.value = ''; });
$('#btn-restore').addEventListener('click', e => { e.stopPropagation(); const t = $('#ta-import').value.trim(); if (t) restore(t); else toast('先貼上備份碼'); });
$('#btn-reset').addEventListener('click', e => {
  e.stopPropagation();
  const b = e.currentTarget;
  if (b.dataset.confirm) { const keep = S.settings; S = defaultState(); S.settings = keep; save(); buildDeck(); renderAll(); toast('已清除所有進度'); $('#dlg-settings').close(); delete b.dataset.confirm; b.textContent = '清除所有進度'; }
  else { b.dataset.confirm = 1; b.textContent = '再按一次確認清除'; setTimeout(() => { delete b.dataset.confirm; b.textContent = '清除所有進度'; }, 3000); }
});

/* ════════════ 鎖定畫面（iOS 不讓整頁被拖動或縮放） ════════════ */
function canScroll(el, dx, dy) {
  for (; el && el !== document.body; el = el.parentElement) {
    const st = getComputedStyle(el);
    if (Math.abs(dy) >= Math.abs(dx) && /(auto|scroll)/.test(st.overflowY) && el.scrollHeight > el.clientHeight + 1) return true;
    if (Math.abs(dx) > Math.abs(dy) && /(auto|scroll)/.test(st.overflowX) && el.scrollWidth > el.clientWidth + 1) return true;
  }
  return false;
}
let tStart = null;
document.addEventListener('touchstart', e => { tStart = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) { e.preventDefault(); return; }
  if (!tStart) return;
  const dx = e.touches[0].clientX - tStart.x, dy = e.touches[0].clientY - tStart.y;
  if (e.target.closest && e.target.closest('#flip-wrap') && Math.abs(dx) > Math.abs(dy)) return; // 閃卡左右滑
  if (!canScroll(e.target, dx, dy)) e.preventDefault();
}, { passive: false });
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

/* ════════════ 初始化 ════════════ */
function renderAll() { renderFamBar(); renderDash(); renderToc(); setView(S.settings.view || 'notes'); }
$('#pm-title').innerHTML = `${esc(D.videoMeta.title)}<div class="pm-sub">${esc(D.videoMeta.channel)} · ${D.videoMeta.durationFormatted}</div>`;
$('#chapters').innerHTML = CHAPTERS.map(([t, s]) => `<button class="chap" data-seek="${s}"><b>${fmt(s)}</b>${esc(t)}</button>`).join('');
setYtLink(0);
buildDeck();
renderAll();
if (isDesktop()) loadYT();
matchMedia('(min-width: 1025px)').addEventListener?.('change', ev => { if (ev.matches) loadYT(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(() => {}));
}
</script>
